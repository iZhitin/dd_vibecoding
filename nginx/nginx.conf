worker_processes 1;

events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    resolver 127.0.0.11 valid=30s;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    
    # HTTP Server (for ACME challenge and redirect)
    server {
        listen 80;
        server_name ddictionary.org;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            # Uncomment to redirect to HTTPS after obtaining certificate
            # return 301 https://$host$request_uri;
            
            # Temporary: Proxy to frontend until SSL is set up
            set $frontend_upstream http://frontend:80;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

